<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect HQ · Delta Force Live</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230c1416'/><polygon points='8,2 14,14 2,14' fill='%231de08c'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="connect.css?v=2">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #0c1416; --hero-top: #132227; --panel: #121c20; --hair: #1d2b30; --hair-2: #16232a; --div: #2b3d43;
    --text: #e9eeed; --text-2: #a4b3b3; --muted: #6d7f80;
    --green: #1de08c; --on-green: #0b0f11; --red: #e0463f; --amber: #e6b34a;
    --hud: 'Chakra Petch', 'Barlow', system-ui, sans-serif;
    --body: Barlow, system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--text); font: 14px/1.5 var(--body); }
  a { color: var(--green); text-decoration: none; } a:hover { color: #6ff0b8; }

  .hero { padding: 20px 32px 22px; background: linear-gradient(180deg, var(--hero-top) 0%, var(--ground) 100%); border-bottom: 1px solid rgba(29, 224, 140, .2); }
  .top { display: flex; align-items: center; gap: 16px; }
  .mark { font: 700 15px var(--hud); letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .tri { width: 12px; height: 12px; background: var(--green); clip-path: polygon(50% 0, 100% 100%, 0 100%); flex: none; }
  .vdiv { width: 1px; height: 18px; background: var(--div); }
  .crumb { font: 600 12px var(--hud); letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); }
  .spacer { flex: 1; }
  h1 { font: 700 34px/1.1 var(--hud); letter-spacing: -.2px; margin: 22px 0 6px; }
  .sub { color: var(--text-2); max-width: 620px; }

  .wrap { max-width: 780px; margin: 0 auto; padding: 26px 32px 60px; }







  .foot { margin-top: 30px; font-size: 12px; color: var(--muted); display: flex; gap: 18px; flex-wrap: wrap; }
  @media (max-width: 620px) { .wrap, .hero { padding-left: 18px; padding-right: 18px; } h1 { font-size: 27px; } }
</style>
</head>
<body>
  <div class="hero">
    <div class="top">
      <div class="mark"><span class="tri"></span>Delta&nbsp;Force&nbsp;Live</div>
      <div class="vdiv"></div>
      <div class="crumb">Connect HQ</div>
      <div class="spacer"></div>
      <a class="crumb" style="color:var(--green)" href="./">‹ Board</a>
    </div>
    <h1 id="title">Connect your HQ account</h1>
    <p class="sub" id="lede">Two clicks, nothing to install and nothing to type. Then the server collects on its own.</p>
  </div>
  <div class="wrap"><div id="flow" class="cflow"></div></div>
  <script src="config.js?v=13"></script>
  <script src="connect-flow.js?v=14"></script>
  <script src="connect.js?v=13"></script>
</body>
</html>
